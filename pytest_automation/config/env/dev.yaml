# 本地开发环境：后端 8086，前端 Vite 5174/5173。
# 注意：本机实测本地下单返回 50000，写操作用例请改用 TEST_ENV=demo。
# UI 用例执行前先启动仓库内前端：
#   (cd shang-mall && npm run dev)          # 默认 5174
#   (cd shang-admin-web && npm run dev)     # 默认 5173
api:
  mall_base: http://localhost:8086
  admin_base: http://localhost:8086

ui:
  mall_url: http://127.0.0.1:5174
  admin_url: http://127.0.0.1:5173

timeout: 30
ui_timeout_ms: 15000

auth:
  sms_code: "123456"
  customer_phone: "13900000009"
  admin_username: "admin"
  # 密码不落文件：运行时通过 ADMIN_PASSWORD 注入
