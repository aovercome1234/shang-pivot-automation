# 用例元数据：标题、验证点、模块与编号前缀。
# 键格式：<测试文件>::<测试函数>；参数化用例只写函数级元数据，参数在导出时展开。
modules:
  tests/api/test_auth.py: {name: 认证, prefix: AUTH}
  tests/api/test_catalog.py: {name: 商品与搜索, prefix: CAT}
  tests/api/test_cart.py: {name: 购物车, prefix: CART}
  tests/api/test_address.py: {name: 收货地址, prefix: ADDR}
  tests/api/test_order.py: {name: 订单, prefix: ORDER}
  tests/api/test_favorites_history.py: {name: 收藏与足迹, prefix: FAV}
  tests/api/test_after_sales_reviews.py: {name: 售后与评价, prefix: ASR}
  tests/api/test_admin.py: {name: 管理端, prefix: ADMIN}
  tests/api/test_security.py: {name: 安全, prefix: SEC}
  tests/api/test_data_driven.py: {name: 数据驱动校验, prefix: DATA}
  tests/api/test_smoke.py: {name: 冒烟, prefix: SMOKE}
  tests/ui/test_mall_browse.py: {name: 商城浏览, prefix: BROWSE}
  tests/ui/test_mall_product.py: {name: 商城商品详情, prefix: PRODUCT}
  tests/ui/test_mall_account.py: {name: 商城个人中心, prefix: ACCOUNT}
  tests/ui/test_mall_login.py: {name: 商城登录, prefix: LOGIN}
  tests/ui/test_mall_cart_checkout.py: {name: 商城购物车与结算, prefix: CART}
  tests/ui/test_mall_orders.py: {name: 商城订单, prefix: ORDER}
  tests/ui/test_admin_console.py: {name: 后台控制台, prefix: ADMIN}
  tests/e2e/test_purchase_flow.py: {name: 端到端购买, prefix: E2E}

cases:
  # ---------- API: 认证 ----------
  "tests/api/test_auth.py::test_send_sms":
    title: 发送短信验证码
    verify: 返回 cooldownSec 且大于 0；演示环境验证码固定 123456
  "tests/api/test_auth.py::test_send_sms_rejects_bad_phone":
    title: 发送验证码时手机号格式错误
    verify: HTTP 400，业务码 40000，提示手机号格式不正确
  "tests/api/test_auth.py::test_login_contract":
    title: 商城验证码登录响应契约
    verify: 返回 accessToken、refreshToken、expiresIn（字符串）与 customer 资料
  "tests/api/test_auth.py::test_login_wrong_code":
    title: 验证码错误时登录失败
    verify: 业务码 40101，提示验证码错误或已过期
  "tests/api/test_auth.py::test_me_returns_current_customer":
    title: 查询当前会员资料
    verify: 返回会员 id 与登录账号一致，status=NORMAL
  "tests/api/test_auth.py::test_me_requires_token":
    title: 未登录访问会员资料
    verify: HTTP 401，业务码 40100/40103
  "tests/api/test_auth.py::test_refresh_token":
    title: 刷新访问令牌
    verify: 返回新的 accessToken 与 expiresIn
  "tests/api/test_auth.py::test_logout_revokes_token":
    title: 登出后访问令牌立即失效
    verify: 登出成功后再访问 /api/me 返回 401
  "tests/api/test_auth.py::test_update_profile":
    title: 修改会员昵称
    verify: 返回新昵称并与资料接口一致
  "tests/api/test_auth.py::test_admin_login_and_me":
    title: 管理员登录并查询当前用户
    verify: username 匹配，返回 roles/permissions/menus
  "tests/api/test_auth.py::test_admin_wrong_password":
    title: 管理员密码错误
    verify: 业务码 40101
  "tests/api/test_auth.py::test_admin_requires_token":
    title: 管理端接口未认证
    verify: HTTP 401，业务码 40100/40103
  "tests/api/test_auth.py::test_response_has_trace_id":
    title: 响应 traceId 契约
    verify: body.traceId 为 32 位十六进制且与响应头 X-Trace-Id 一致

  # ---------- API: 商品与搜索 ----------
  "tests/api/test_catalog.py::test_home_feed_and_slots":
    title: 首页 feed 与运营位
    verify: feed/slots 非空，商品含 spuId/name/price
  "tests/api/test_catalog.py::test_site_brand":
    title: 站点品牌信息
    verify: 返回品牌 name 与 slogan
  "tests/api/test_catalog.py::test_categories":
    title: 商品分类列表
    verify: 返回非空列表且含分类 id/name
  "tests/api/test_catalog.py::test_products_pagination":
    title: 商品分页查询
    verify: 分页结构正确，total>0，本页条数不超过 size
  "tests/api/test_catalog.py::test_price_sort":
    title: 商品价格排序
    verify: price_asc 价格升序，price_desc 价格降序
  "tests/api/test_catalog.py::test_product_detail":
    title: 商品详情契约
    verify: 返回 spu/skus/favorited；skuId 为字符串，库存为非负整数
  "tests/api/test_catalog.py::test_product_not_found":
    title: 查询不存在的商品
    verify: 业务码 40410，提示商品不存在或未上架
  "tests/api/test_catalog.py::test_out_of_range_page_is_stable":
    title: 负数页码稳定性
    verify: 不返回 5xx，分页结构仍然合法
  "tests/api/test_catalog.py::test_huge_size_is_stable":
    title: 超大 size 参数稳定性
    verify: HTTP 200，不返回 5xx
  "tests/api/test_catalog.py::test_search_hit":
    title: 关键字搜索命中商品
    verify: total>0，结果名称包含关键字
  "tests/api/test_catalog.py::test_search_no_result":
    title: 搜索无结果
    verify: total=0，records 为空列表
  "tests/api/test_catalog.py::test_search_empty_keyword":
    title: 空关键字搜索
    verify: 返回合法分页结构
  "tests/api/test_catalog.py::test_search_sql_injection_is_safe":
    title: 搜索参数 SQL 注入安全
    verify: 注入串返回空结果，无 5xx，traceId 正常

  # ---------- API: 购物车 ----------
  "tests/api/test_cart.py::test_add_and_read_cart":
    title: 加购并读取购物车
    verify: 数量与选中金额正确，条目 selected=true
  "tests/api/test_cart.py::test_update_quantity":
    title: 修改购物车商品数量
    verify: 数量更新为 3，购物车回显一致
  "tests/api/test_cart.py::test_unselect_item":
    title: 取消勾选购物车商品
    verify: 条目 selected=false，selectedAmount=0
  "tests/api/test_cart.py::test_remove_item":
    title: 删除购物车商品
    verify: 购物车列表不再包含该条目
  "tests/api/test_cart.py::test_clear_invalid":
    title: 清理失效商品
    verify: 操作成功，有效商品保留
  "tests/api/test_cart.py::test_cart_requires_auth":
    title: 未登录加购
    verify: HTTP 401，业务码 40100/40103
  "tests/api/test_cart.py::test_add_unknown_sku":
    title: 加购不存在的 SKU
    verify: 业务码 40410
  "tests/api/test_cart.py::test_add_invalid_quantity":
    title: 加购数量非法
    verify: 业务码 40000，提示数量须 ≥ 1
  "tests/api/test_cart.py::test_add_over_stock":
    title: 加购数量超过库存
    verify: 业务码 40901，提示库存不足
  "tests/api/test_cart.py::test_update_missing_cart_item":
    title: 修改不存在的购物车项
    verify: 业务码 40400

  # ---------- API: 收货地址 ----------
  "tests/api/test_address.py::test_create_and_list":
    title: 新增地址并查询列表
    verify: 创建成功，列表回显姓名/详细地址，默认地址为 true
  "tests/api/test_address.py::test_update_address":
    title: 修改收货地址
    verify: 更新详细地址后列表回显新值
  "tests/api/test_address.py::test_set_default_address":
    title: 设置默认地址
    verify: 新地址成为唯一默认，原默认地址被取消
  "tests/api/test_address.py::test_incomplete_address_rejected":
    title: 地址必填项缺失
    verify: 业务码 40000，提示收货信息不完整
  "tests/api/test_address.py::test_delete_missing_address":
    title: 删除不存在的地址
    verify: 业务码 40400
  "tests/api/test_address.py::test_cannot_update_other_users_address":
    title: 越权修改他人地址
    verify: 业务码 40400，不能修改非本人地址
  "tests/api/test_address.py::test_cannot_delete_other_users_address":
    title: 越权删除他人地址
    verify: 业务码 40400，不能删除非本人地址

  # ---------- API: 订单 ----------
  "tests/api/test_order.py::test_submit_from_cart":
    title: 购物车提交订单
    verify: 状态 PENDING_PAY，订单号/商品金额/运费/明细正确
  "tests/api/test_order.py::test_submit_is_idempotent":
    title: 下单幂等
    verify: 相同 idempotentKey 两次提交返回同一订单
  "tests/api/test_order.py::test_buy_now_without_cart":
    title: 立即购买下单
    verify: 不经过购物车直接创建待支付订单
  "tests/api/test_order.py::test_missing_idempotent_key":
    title: 下单缺少幂等键
    verify: 业务码 40000，提示 idempotentKey 必填
  "tests/api/test_order.py::test_invalid_address":
    title: 下单地址不存在
    verify: 业务码 40000，提示收货地址无效
  "tests/api/test_order.py::test_cannot_use_other_users_address":
    title: 使用他人地址下单
    verify: 业务码 40000，地址归属校验生效
  "tests/api/test_order.py::test_order_list":
    title: 我的订单列表
    verify: 按状态过滤，列表包含新订单
  "tests/api/test_order.py::test_order_detail_has_items_and_snapshot":
    title: 订单详情与地址快照
    verify: 返回订单明细与地址快照，shipments 为空
  "tests/api/test_order.py::test_order_not_found":
    title: 查询不存在的订单
    verify: 业务码 40400
  "tests/api/test_order.py::test_cannot_read_other_users_order":
    title: 越权读取他人订单
    verify: 业务码 40400
  "tests/api/test_order.py::test_cancel_pending_order":
    title: 取消待支付订单
    verify: 状态变为 CLOSED，关闭原因为“用户取消”
  "tests/api/test_order.py::test_cancel_is_idempotent":
    title: 重复取消订单幂等
    verify: 两次取消均成功，不报错
  "tests/api/test_order.py::test_confirm_receive_requires_shipped":
    title: 未发货订单确认收货
    verify: 业务码 40902
  "tests/api/test_order.py::test_sandbox_payment":
    title: 沙箱支付
    verify: 订单变为 PENDING_SHIP，支付单 PAID，tradeNo 正确
  "tests/api/test_order.py::test_pay_twice_and_cancel_paid":
    title: 重复支付与取消已支付订单
    verify: 两次操作均返回 40902
  "tests/api/test_order.py::test_customer_token_cannot_access_admin":
    title: 商城令牌访问管理端
    verify: HTTP 401，业务码 40100/40103

  # ---------- API: 收藏与足迹 ----------
  "tests/api/test_favorites_history.py::test_add_list_remove_favorite":
    title: 收藏、查询并取消收藏
    verify: 收藏列表包含 spuId，商品详情 favorited 随收藏状态变化
  "tests/api/test_favorites_history.py::test_remove_missing_favorite_is_safe":
    title: 重复取消收藏幂等
    verify: 不返回 5xx
  "tests/api/test_favorites_history.py::test_view_product_records_history":
    title: 浏览商品写入足迹
    verify: 足迹列表包含刚浏览的 spuId
  "tests/api/test_favorites_history.py::test_clear_history":
    title: 清空浏览足迹
    verify: 清空后足迹列表为空

  # ---------- API: 售后与评价 ----------
  "tests/api/test_after_sales_reviews.py::test_apply_rejected_for_pending_pay":
    title: 待支付订单申请售后
    verify: 业务码 40902，当前状态不可申请
  "tests/api/test_after_sales_reviews.py::test_apply_rejects_invalid_type":
    title: 售后类型非法
    verify: 业务码 40000，提示 type 无效
  "tests/api/test_after_sales_reviews.py::test_apply_requires_fields":
    title: 售后必填字段缺失
    verify: 业务码 40000，提示订单/类型/原因必填
  "tests/api/test_after_sales_reviews.py::test_my_after_sales_page":
    title: 我的售后分页
    verify: 返回合法分页结构
  "tests/api/test_after_sales_reviews.py::test_review_rejected_before_completed":
    title: 未完成订单发表评价
    verify: 业务码 40902，仅已完成订单可评价
  "tests/api/test_after_sales_reviews.py::test_product_reviews_public":
    title: 商品评价列表公开可读
    verify: 未登录可访问，返回合法分页

  # ---------- API: 管理端 ----------
  "tests/api/test_admin.py::test_dashboard_stats":
    title: 管理端工作台指标
    verify: 返回在售商品/SKU/低库存/待发货/订单总数，均为数字字符串
  "tests/api/test_admin.py::test_product_list":
    title: 管理端商品分页
    verify: 分页结构正确，首行含 id/name/status/stock
  "tests/api/test_admin.py::test_product_detail":
    title: 管理端商品详情
    verify: 按列表首条 id 查询成功
  "tests/api/test_admin.py::test_category_tree":
    title: 管理端类目树
    verify: 返回非空树结构
  "tests/api/test_admin.py::test_brands_page":
    title: 管理端品牌分页
    verify: 返回合法分页结构
  "tests/api/test_admin.py::test_dicts_page":
    title: 管理端字典分页
    verify: 返回合法分页结构
  "tests/api/test_admin.py::test_order_list":
    title: 管理端订单分页
    verify: 返回合法分页结构
  "tests/api/test_admin.py::test_order_detail":
    title: 管理端订单详情
    verify: 按列表首条 id 查询成功；列表为空时先用隔离会员造单再查询
  "tests/api/test_admin.py::test_customers_page":
    title: 管理端会员分页
    verify: 返回合法分页结构
  "tests/api/test_admin.py::test_operation_logs":
    title: 管理端操作日志分页
    verify: 返回合法分页结构
  "tests/api/test_admin.py::test_missing_product_is_business_error":
    title: 管理端查询不存在商品
    verify: 返回 40400/40410，不返回 5xx

  # ---------- API: 安全 ----------
  "tests/api/test_security.py::test_tampered_token_rejected":
    title: 篡改访问令牌
    verify: HTTP 401，业务码 40100/40103
  "tests/api/test_security.py::test_customer_token_rejected_by_admin":
    title: 商城令牌访问管理端
    verify: HTTP 401，业务码 40100/40103
  "tests/api/test_security.py::test_login_phone_sql_injection":
    title: 登录手机号 SQL 注入
    verify: HTTP 400，业务码 40000，参数校验拦截
  "tests/api/test_security.py::test_search_xss_payload_is_inert":
    title: 搜索 XSS 载荷
    verify: 返回空结果，响应不包含原始脚本标签
  "tests/api/test_security.py::test_oversized_page_does_not_500":
    title: 超大分页参数
    verify: HTTP 200，不返回 5xx
  "tests/api/test_security.py::test_error_response_keeps_trace_id":
    title: 错误响应 traceId
    verify: traceId 为 32 位十六进制且与响应头一致

  # ---------- API: 数据驱动 ----------
  "tests/api/test_data_driven.py::test_login_input_validation":
    title: 登录输入参数校验
    verify: HTTP 400，业务码 40000，提示对应字段错误

  # ---------- API: 冒烟 ----------
  "tests/api/test_smoke.py::test_storefront_is_reachable":
    title: 商城商品接口可达
    verify: 商品列表返回非空数据
  "tests/api/test_smoke.py::test_customer_can_login":
    title: 会员登录态可用
    verify: /api/me 返回 NORMAL 状态
  "tests/api/test_smoke.py::test_admin_can_login":
    title: 管理员登录态可用
    verify: /admin/auth/me 返回用户名

  # ---------- UI: 商城浏览 ----------
  "tests/ui/test_mall_browse.py::test_home_loads_products":
    title: 商城首页加载商品
    verify: 商品链接与“热门精选”可见
  "tests/ui/test_mall_browse.py::test_search_shows_matching_products":
    title: 商城搜索商品
    verify: 搜索结果包含 iPhone
  "tests/ui/test_mall_browse.py::test_category_page_loads":
    title: 商城分类页加载
    verify: 分类页标题、商品链接与综合/销量排序可见
  "tests/ui/test_mall_browse.py::test_search_no_result_shows_empty_state":
    title: 搜索无结果显示空态
    verify: 展示“没有找到相关商品”与“为你推荐”

  # ---------- UI: 商城商品详情 ----------
  "tests/ui/test_mall_product.py::test_product_detail_shows_skus":
    title: 商品详情展示规格
    verify: 商品名称、规格选项与收藏入口可见
  "tests/ui/test_mall_product.py::test_favorite_toggle":
    title: 商品收藏与取消收藏
    verify: 收藏后显示“已收藏”，再次点击恢复“收藏”

  # ---------- UI: 商城个人中心 ----------
  "tests/ui/test_mall_account.py::test_profile_page_loads":
    title: 个人中心页面加载
    verify: 显示退出登录、收货地址、我的收藏入口
  "tests/ui/test_mall_account.py::test_settings_page_loads":
    title: 设置页加载
    verify: 显示登录手机号与 Web/H5 登录态说明
  "tests/ui/test_mall_account.py::test_after_sales_page_loads":
    title: 我的售后页加载
    verify: 页面标题与空态/列表可见
  "tests/ui/test_mall_account.py::test_address_page_shows_api_address":
    title: 地址页展示已有地址
    verify: 显示收货人、详细地址与默认标记
  "tests/ui/test_mall_account.py::test_add_and_delete_address_via_ui":
    title: 页面新增并删除地址
    verify: 表单保存后列表出现，删除后回到暂无地址
  "tests/ui/test_mall_account.py::test_favorites_page_and_remove":
    title: 收藏页取消收藏
    verify: 收藏列表显示商品，确认后回到空态
  "tests/ui/test_mall_account.py::test_history_page_and_clear":
    title: 足迹页清空
    verify: 浏览记录显示，确认清空后回到空态
  "tests/ui/test_mall_account.py::test_promo_page_loads":
    title: 活动位页面加载
    verify: 显示活动标题与商品列表

  # ---------- UI: 商城登录 ----------
  "tests/ui/test_mall_login.py::test_login_success":
    title: 商城验证码登录成功
    verify: 登录后顶栏显示“Hi，昵称”
  "tests/ui/test_mall_login.py::test_login_wrong_code_shows_inline_error":
    title: 错误验证码内联提示
    verify: 表单下方显示“验证码错误，请重新获取”
  "tests/ui/test_mall_login.py::test_login_invalid_phone_shows_inline_error":
    title: 手机号格式内联提示
    verify: 表单下方显示“请输入正确的手机号”

  # ---------- UI: 商城购物车与结算 ----------
  "tests/ui/test_mall_cart_checkout.py::test_add_to_cart_from_product_detail":
    title: 商品详情页加入购物车
    verify: 购物车出现 iPhone 商品
  "tests/ui/test_mall_cart_checkout.py::test_checkout_requires_selected_item":
    title: 未勾选商品去结算
    verify: 提示“请先勾选商品”，停留在购物车页
