# 业务分类体系：Allure Suites = 业务域 → 业务模块；验证维度只作为标签，不再单独成为套件。
#
# 匹配优先级（高 → 低）：
# 1) function_overrides：明确的跨域用例（如“会员 token 不得访问管理端”）
# 2) endpoint_rules：按用例实际调用的接口选择优先级最高的业务动作
# 3) keyword_rules：无接口映射时，按测试函数名/类名兜底
# 4) file_rules：按测试文件兜底
# 5) default
#
# endpoint_rules.priority 用于多接口用例选“测试主体”：
# 例如下单用例会先调地址/购物车，再调订单；订单优先级更高，因此归入“订单与支付”。

default:
  domain: 平台治理
  module: 未分类
  dimension: 功能

function_overrides:
  "tests/api/test_security.py::test_tampered_token_rejected":
    domain: 会员中心
    module: 登录与令牌
  "tests/api/test_security.py::test_customer_token_rejected_by_admin":
    domain: 平台治理
    module: 身份与权限
  "tests/api/test_order.py::test_customer_token_cannot_access_admin":
    domain: 平台治理
    module: 身份与权限
  "tests/api/test_auth.py::TestAdminAuth::test_admin_requires_token":
    domain: 平台治理
    module: 身份与权限
  "tests/api/test_failure_evidence_demo.py::test_demo_business_assertion_failure":
    domain: 平台治理
    module: 测试基础设施
  "tests/api/test_failure_evidence_demo.py::test_demo_broken_exception":
    domain: 平台治理
    module: 测试基础设施

