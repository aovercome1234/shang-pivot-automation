      brandId: {column: brand_id, type: string, optional: true}
      name: {column: name}
      subtitle: {column: subtitle, optional: true}
      detailHtml: {column: detail_html, optional: true}
      status: {column: status, optional: true}
    special:
      - {json_from: pics, column: pics}
      - {json_from: videos, column: videos}
    generated: [id, created_at, updated_at]

  "PUT /admin/products/{id}":
