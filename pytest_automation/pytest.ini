[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 工程根目录进 sys.path，用例可直接 import core / fixtures / pages
pythonpath = .

addopts =
    -ra
    --tb=short
    --strict-markers
    --basetemp=.pytest_tmp
    --browser=chromium

markers =
    api: 接口自动化用例
    ui: 浏览器 UI 自动化用例
    e2e: 端到端业务链路
    security: 安全类用例
    smoke: 冒烟用例，每次提交都跑
    regression: 回归用例
    P0: 最高优先级
    P1: 次高优先级
    P2: 低优先级或异常/边界

# 参数为空时按 xfail 记录，避免静默跳过
empty_parameter_set_mark = xfail
xfail_strict = false
