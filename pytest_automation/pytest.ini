[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 工程根目录进 sys.path，用例可直接 import core / fixtures / pages
pythonpath = .

addopts =
    -ra
    --tb=short
    --strict-markers
    --basetemp=.pytest_tmp
    --browser=chromium
    --reruns 1
    --reruns-delay 1

markers =
    api: 接口自动化用例
    ui: 浏览器 UI 自动化用例
    e2e: 端到端业务链路
    security: 安全类用例
    db: 依赖数据库内部一致性断言的用例
    idempotency: 幂等专项用例（重复提交/重复操作不产生重复副作用）
    bulk: 大数据量用例（大分页/深翻页/批量写入）
    serial: 并行不安全的用例（库存批量、登录失败限流等），两阶段执行时串行运行
    xdist_group: xdist 分发分组（按主体接口自动生成，内部使用）
    validation: 输入校验专项（等价类划分/边界值分析）
    demo: 失败留痕演示用例（默认跳过，DEMO_FAILURE=1 时运行）
    smoke: 冒烟用例，每次提交都跑
    regression: 回归用例
    P0: 最高优先级
    P1: 次高优先级
    P2: 低优先级或异常/边界

# 参数为空时按 xfail 记录，避免静默跳过
empty_parameter_set_mark = xfail
xfail_strict = false
