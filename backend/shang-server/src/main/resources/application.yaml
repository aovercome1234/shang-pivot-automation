spring:
  application:
    name: shang-pivot
  config:
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  datasource:
    # 公网 PG 易抖：connectTimeout/loginTimeout 拉长；tcpKeepAlive 防 NAT 静默掐线
    # stringtype=unspecified：commerce."order".address_snapshot 等列是 jsonb，
    # 不加该参数时 String 参数会被当作 varchar 绑定，导致
    # `column "address_snapshot" is of type jsonb but expression is of type character varying` → 下单必 500。
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shang?sslmode=disable&stringtype=unspecified&connectTimeout=15&socketTimeout=60&tcpKeepAlive=true&loginTimeout=15}
    username: ${DB_USERNAME:shang}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 20000
      validation-timeout: 5000
      maximum-pool-size: 5
      # 低于 maximum，idle-timeout 才生效；远程库少养闲连接
      minimum-idle: 1
      # >0：启动时在窗口内重试拿首连，避免公网偶发 EOF 直接把进程打挂
      initialization-fail-timeout: 60000
      # 远程/NAT 常先关空闲连接：lifetime 与 keepalive 要更积极
      max-lifetime: 120000
      keepalive-time: 30000
      idle-timeout: 60000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2
        default-requeue-rejected: false
  data:
    redis:
      database: ${REDIS_DATABASE:0}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 开发库偶发改过已应用脚本时，启动前自动校正 flyway_schema_history 校验和
    repair-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    # Jackson 3：日期特性从 SerializationFeature 迁到 DateTimeFeature（默认已是 ISO-8601）
    datatype:
      datetime:
        write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    mbeanregistry:
      # 打开 Tomcat 的 MBean 注册表，Micrometer 才会暴露 tomcat_threads_* / tomcat_connections_*；
      # 不打开时线程池饱和在监控上是盲区（可观测平台的告警与面板依赖这几个指标）
      enabled: true

# 可观测平台（observability/）：actuator 指标端点单独监听回环 8087，
# 不进 nginx、不暴露公网；Prometheus 通过 SSH 正向隧道采集 /actuator/prometheus。
management:
  server:
    port: ${MANAGEMENT_PORT:8087}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT / OSS
shang:
  jwt:
    secret: ${JWT_SECRET:shang-pivot-dev-jwt-secret-change-me-32bytes-min!!}
    access-ttl-seconds: ${JWT_ACCESS_TTL:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL:604800}
  cors:
    # 逗号分隔的精确 Origin 列表（allowCredentials=true 时不允许 *）。
    # Nginx 反代未透传原始 Host 时，浏览器同源 POST 也会带 Origin，
    # 后端据此判定为跨源并按本列表放行；缺一条即 403 "Invalid CORS request"（登录/注册全被拦）。
    # 部署域名变化只改环境变量 SHANG_CORS_ALLOWED_ORIGINS，无需改代码重新构建。
    allowed-origins: ${SHANG_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:3000,http://localhost:8086,http://127.0.0.1:8086,http://111.170.33.2:60084,http://111.170.33.2:60085}
  oss:
    endpoint: ${MINIO_ENDPOINT:localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket-name: ${MINIO_BUCKET_NAME:shang-pivot}
    public-base-url: ${MINIO_PUBLIC_BASE_URL:}
    presign-expire-seconds: 600
    max-size-bytes: 10485760

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    root: INFO
    com.shangpivot: INFO
    # 排查 SQL 时可打开：
    # com.shangpivot: DEBUG
    # com.baomidou.mybatisplus: DEBUG
  # 文件日志目录见 logback-spring.xml 的 LOG_HOME，默认 backend/logs（勿落 shang-server/logs）
