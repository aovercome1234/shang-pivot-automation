# Cucumber（JUnit Platform）运行配置
# 特性文件位置由 RunCucumberTest 的 @SelectClasspathResource("features") 指定，
# 这里不再设 cucumber.features —— JUnit 6 下该属性会覆盖套件的 selection 并告警。
cucumber.glue=com.shangpivot.ui

# 报告与结果：json/html 供人看，UiResultsPlugin 落机器可读结果（可交给 zentao_sync.py sync-results）
cucumber.plugin=pretty,\
  html:artifacts/ui/cucumber-report.html,\
  json:artifacts/ui/cucumber-report.json,\
  com.shangpivot.ui.support.UiResultsPlugin:artifacts/automation_results_ui.json

# 不向 report.cucumber.io 发包（内网环境）
cucumber.publish.quiet=true
# 串行执行：UI 场景共享同一演示环境，并发会互相干扰数据
cucumber.execution.parallel.enabled=false
