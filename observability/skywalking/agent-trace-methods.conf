# SkyWalking Java Agent 自定义方法级 trace 建议配置。
# 目的：补齐“接口 → 代码方法 → SQL/Redis/MQ”中的代码层，尤其是登录、订单、支付、售后、评价。
#
# 使用方式（按目标服务器实际部署方式二选一）：
# 1. 写入 SkyWalking agent.config 的 agent.trace_methods；
# 2. 用等价的启动系统属性/环境变量覆盖（例如 -Dskywalking.agent.trace_methods=...，具体以部署脚本为准）。
#
# 注意：
# - 该配置不支持通配符；修改后需要重启 shang-pivot 应用；
# - 方法级 span 会增加少量性能开销，压测期间建议开启，长期保留需观察 agent overhead；
# - 不要在这里配置密码、Token 等敏感信息。

agent.trace_methods=\
com.shangpivot.identity.controller.CustomerAuthController[sendSms,login,refresh,logout,me,updateMe];\
com.shangpivot.identity.application.CustomerAuthService[sendSms,login,refresh,logout,me,updateMe];\
com.shangpivot.commerce.controller.StorefrontController[brand,home,categories,products,productDetail,search,cart,addCart,updateCart,removeCart,clearInvalid,addresses,createAddress,updateAddress,deleteAddress,defaultAddress,submit,myOrders,orderDetail,cancel,confirm,sandboxPay,payStatus,applyAfterSale,myAfterSales,afterSaleDetail,createReview,productReviews];\
com.shangpivot.commerce.application.CatalogReadService[home,categories,productPage,search,detail,toCard];\
com.shangpivot.commerce.application.CartService[getCart,addItem,updateItem,removeItem,clearInvalid];\
com.shangpivot.commerce.application.AddressService[list,create,update,delete,setDefault];\
com.shangpivot.commerce.application.OrderSubmitService[submit,cancel,closeAndUnlock,confirmReceive];\
com.shangpivot.commerce.application.PaymentSandboxService[pay,status];\
com.shangpivot.commerce.application.OrderService[page,listForExport,detail,ship];\
com.shangpivot.commerce.application.AfterSaleService[apply,myPage,myDetail,audit];\
com.shangpivot.commerce.application.ReviewAdminService[page,updateStatus]
