cucumber.filter.tags=not @known-defect
cucumber.publish.quiet=true
cucumber.glue=com.shangpivot.automation
cucumber.plugin=pretty, html:target/cucumber-report.html, json:target/cucumber-report.json, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=1
